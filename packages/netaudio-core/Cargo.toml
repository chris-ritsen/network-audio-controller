[package]
name = "netaudio-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "netaudio_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
h264-reader = "0.9"
caseless = "0.2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
crypto_secretbox = "0.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
roxmltree = "0.21"
schemars = { version = "1.2.3", features = ["raw_value"], optional = true }

[features]
schema = ["dep:schemars"]

[[bin]]
name = "export-schema"
path = "src/bin/export_schema.rs"
required-features = ["schema"]

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "visionos", target_os = "watchos")))'.dependencies]
base64 = "0.23"
cfb = "0.16"
flate2 = "1"
lzxd = "0.2"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
