[package]
name = "netaudio-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "netaudio_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crypto_secretbox = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
panic = "abort"
overflow-checks = true
