[package]
name = "netaudio-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "netaudio_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
caseless = "0.2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
crypto_secretbox = "0.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
roxmltree = "0.20"
schemars = { version = "=1.2.1", features = ["raw_value"], optional = true }

[features]
schema = ["dep:schemars"]

[[bin]]
name = "export-schema"
path = "src/bin/export_schema.rs"
required-features = ["schema"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
