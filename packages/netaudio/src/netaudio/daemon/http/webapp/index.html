<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>netaudio</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" sizes="any" />
    <script>
      (() => {
        let appearance = "system";
        try { appearance = localStorage.getItem("netaudio.appearance") || "system"; } catch {}
        const scheme = appearance === "light" || appearance === "dark" ? appearance : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = scheme;
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>
    <link rel="stylesheet" href="/app.css" />
    <script type="importmap">
      {
        "imports": {
          "@preact/signals": "/vendor/signals.module.js",
          "@preact/signals-core": "/vendor/signals-core.module.js",
          "htm": "/vendor/htm.module.js",
          "preact": "/vendor/preact.module.js",
          "preact/hooks": "/vendor/preact-hooks.module.js"
        }
      }
    </script>
  </head>
  <body>
    <section id="startup" class="content" role="status" hidden>
      <h1>Unable to load NetAudio</h1>
      <p id="startup-detail"></p>
      <button type="button" class="btn" onclick="window.location.reload()">Reload</button>
    </section>
    <noscript>Enable JavaScript to open NetAudio.</noscript>
    <div id="root"></div>
    <script>
      const startup = document.getElementById("startup");
      const detail = document.getElementById("startup-detail");
      const timeout = setTimeout(() => {
        detail.textContent = "Check your connection and reload.";
        startup.hidden = false;
      }, 10000);
      import("/i18n.js").then((i18n) => i18n.loadLanguage()).then(() => import("/app.js")).then(() => {
        clearTimeout(timeout);
        startup.remove();
      }).catch((error) => {
        clearTimeout(timeout);
        detail.textContent = error.message || "Check your connection and reload.";
        startup.hidden = false;
      });
    </script>
  </body>
</html>
