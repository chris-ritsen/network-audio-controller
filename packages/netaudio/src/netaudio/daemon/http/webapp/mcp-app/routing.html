@keyframes toast {
  0% {
    scale: 0.9;
    opacity: 0;
  }
  100% {
    scale: 1;
    opacity: 1;
  }
}
@keyframes aura {
  to {
    --aura-angle: 360deg;
    transform: translateZ(1px);
  }
}
@keyframes aura-glow {
  20%,
  80% {
    opacity: 0.7;
    filter: blur(0.25rem);
  }
  50% {
    opacity: 1;
    filter: blur(0.75rem);
  }
}
@keyframes aura-glow-after {
  20%,
  80% {
    opacity: 0.3;
    filter: blur(1rem);
  }
  50% {
    opacity: 0.6;
    filter: blur(1.5rem);
  }
}
@keyframes radio {
  0% {
    padding: 5px;
  }
  50% {
    padding: 3px;
  }
}
@keyframes progress {
  50% {
    background-position-x: -115%;
  }
}
@keyframes menu {
  0% {
    opacity: 0;
  }
}
@keyframes skeleton {
  0% {
    background-position: 150%;
  }
  100% {
    background-position: -50%;
  }
}
@keyframes rating {
  0%,
  40% {
    scale: 1.1;
    filter: brightness(1.05) contrast(1.05);
  }
}
@keyframes rotator {
  89.9999%,
  100% {
    --first-item-position: 0 0%;
  }
  90%,
  99.9999% {
    --first-item-position: 0 calc(var(--items) * 100%);
  }
  100% {

@keyframes dropdown {
