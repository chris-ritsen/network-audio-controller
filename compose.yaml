# Dante discovery uses mDNS and multicast on the local network, so the daemon
# shares the host's network stack. Run this on a Linux host attached to the
# Dante network; Docker Desktop's VM cannot see Dante multicast traffic.
#
#   docker compose up -d --build
#   docker compose exec netaudio netaudio device list
#   docker compose logs -f netaudio
#
# The web interface is served on https://<host>:9443 with a self-signed
# certificate kept in the netaudio-data volume. `netaudio daemon web` lists the
# addresses and the certificate fingerprint:
#
#   docker compose exec netaudio netaudio daemon web
#
# Firewall: host networking bypasses Docker's published-port rules, so the
# host firewall (ufw, firewalld) applies to the daemon directly. A timeout in
# the browser means the port is blocked. With ufw, allow the web interface and
# the Dante discovery, status and metering traffic from the Dante network:
#
#   sudo ufw allow 9443/tcp
#   sudo ufw allow in on eno2 from 192.168.8.0/24 proto udp
#
# Replace eno2 and 192.168.8.0/24 with the Dante interface and subnet.
#
# Ports: when another service on the host already uses 9000 or 9443 (Portainer
# uses both), set NETAUDIO_DAEMON_PORT below and move HTTPS in the config file,
# then allow that port in the firewall instead:
#
#   docker compose run --rm --entrypoint sh netaudio -c \
#     'printf "[daemon]\ntls_port = 9444\n" > /data/config/config.toml'
#   docker compose up -d --force-recreate

services:
  netaudio:
    build: .
    image: netaudio:local
    network_mode: host
    restart: unless-stopped
    environment:
      NETAUDIO_LOG_LEVEL: ${NETAUDIO_LOG_LEVEL:-WARNING}
      # Loopback-only HTTP port used by the CLI and healthcheck. Change it when
      # another service on the host (e.g. Portainer) already uses 9000.
      NETAUDIO_DAEMON_PORT: ${NETAUDIO_DAEMON_PORT:-9000}
      # Pin the Dante network interface on hosts with more than one, for
      # example NETAUDIO_INTERFACE=eno2 in a .env file beside this one.
      NETAUDIO_INTERFACE: ${NETAUDIO_INTERFACE:-}
      # Matches the optional redis service below, so the daemon does not attach
      # to another Redis already listening on the host's default port 6379.
      REDIS_PORT: "6380"
    volumes:
      - netaudio-data:/data

  # Optional: `docker compose --profile redis up -d` publishes device state to
  # Redis. The daemon runs without it.
  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6380", "--save", "", "--appendonly", "no"]
    network_mode: host

volumes:
  netaudio-data:
