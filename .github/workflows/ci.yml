name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check
      - run: uv run --python 3.10 --no-project python -m compileall -q packages/netaudio/src/netaudio
      - run: uv run ruff check .
      - run: uv run python scripts/check_complexity.py

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: cargo test --manifest-path packages/netaudio-core/Cargo.toml
      - run: uv run pytest -q
