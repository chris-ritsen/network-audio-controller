name: quality

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        options: [python, webapp, native, compatibility]
        default: python
      browser_tests:
        description: Include browser UI tests
        type: boolean
        default: false

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp-tests:
    if: inputs.scope == 'webapp' || inputs.scope == 'compatibility'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.scope == 'compatibility' && '["ubuntu-latest", "macos-15", "windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:webapp
      - run: git diff --exit-code -- packages/netaudio/src/netaudio/daemon/http/webapp/app.css packages/netaudio/src/netaudio/daemon/http/webapp/icon-paths.js
      - run: python scripts/check_project.py --scope webapp --report "${{ runner.temp }}/checks/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webapp-checks-${{ matrix.runner }}
          path: ${{ runner.temp }}/checks/
      - if: inputs.browser_tests
        run: npx playwright install --with-deps chromium webkit
      - if: inputs.browser_tests
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.runner }}
          path: test-results/

  python-tests:
    if: inputs.scope == 'python' || inputs.scope == 'compatibility'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.scope == 'compatibility' && '["3.9", "3.10", "3.11", "3.12", "3.13"]' || '["3.13"]') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python ${{ matrix.python-version }} --all-groups
      - run: uv run --python ${{ matrix.python-version }} python scripts/check_project.py --scope python --report "${{ runner.temp }}/checks/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-checks-${{ matrix.python-version }}
          path: ${{ runner.temp }}/checks/

  cross-platform-tests:
    if: inputs.scope == 'compatibility'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, macos-15, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv run python scripts/check_project.py --scope runtime --report "${{ runner.temp }}/checks/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-checks-${{ matrix.runner }}
          path: ${{ runner.temp }}/checks/

  native-quality:
    if: inputs.scope == 'native' || inputs.scope == 'compatibility'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.9 --all-groups
      - run: uv run --python 3.9 python scripts/check_project.py --scope native --report "${{ runner.temp }}/checks/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-checks
          path: ${{ runner.temp }}/checks/

  installed-wheel:
    if: inputs.scope == 'compatibility'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64:latest
            library: packages/netaudio-core/target/release/libnetaudio_core.so
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64:latest
            library: packages/netaudio-core/target/release/libnetaudio_core.so
          - runner: macos-15
            platform: macos
            architecture: arm64
            library: packages/netaudio-core/target/release/libnetaudio_core.dylib
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
            library: packages/netaudio-core/target/release/libnetaudio_core.dylib
          - runner: windows-latest
            platform: windows
            architecture: x86_64
            library: packages/netaudio-core/target/release/netaudio_core.dll
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: matrix.platform == 'linux'
        name: Build at the manylinux 2.28 compatibility floor
        shell: bash
        run: |
          docker run --pull always --rm \
            --volume "$PWD:/project" --workdir /project \
            "${{ matrix.manylinux-image }}" /bin/bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$HOME/.cargo/bin:/opt/python/cp39-cp39/bin:$PATH"
              python -m pip install --disable-pip-version-check uv auditwheel
              uv build --wheel
              wheel=(dist/*.whl)
              test "${#wheel[@]}" -eq 1
              original_wheel="${wheel[0]}"
              mkdir -p dist/unrepaired
              mv "$original_wheel" dist/unrepaired/
              auditwheel repair --plat "manylinux_2_28_$(uname -m)" \
                --wheel-dir dist "dist/unrepaired/${original_wheel##*/}"
              repaired_wheel=(dist/*.whl)
              test "${#repaired_wheel[@]}" -eq 1
              auditwheel show "${repaired_wheel[0]}"
            '
      - if: matrix.platform != 'linux'
        run: uv build --wheel
      - shell: bash
        run: |
          wheel=(dist/*.whl)
          if [ "${#wheel[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist, found ${#wheel[@]}" >&2
            exit 1
          fi
          python scripts/verify_wheel_artifact.py "${wheel[0]}" \
            --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}"
          for python_version in 3.9 3.10 3.11 3.12 3.13; do
            uv run --isolated --no-project --python "$python_version" \
              python scripts/smoke_wheel_install.py "${wheel[0]}"
          done
      - run: python scripts/check_native_abi.py "${{ matrix.library }}"
