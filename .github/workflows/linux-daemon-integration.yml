name: Linux daemon packaging

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: linux-daemon-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install --yes dbus-daemon libasound2-dev libjack-jackd2-dev libpulse-dev pkg-config
      - run: uv sync --python 3.10 --all-groups
      - name: Validate generated systemd unit syntax
        run: |
          unit="$(mktemp --suffix=.service)"
          uv run python -c 'from netaudio.daemon.service_install import generate_systemd_unit; import sys; print(generate_systemd_unit(sys.executable), end="")' > "$unit"
          systemd-analyze verify "$unit"
