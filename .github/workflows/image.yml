name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      IMAGE: docker.io/s00pcan/netaudio
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: s00pcan
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - shell: bash
        run: |
          docker buildx build --file containers/Dockerfile \
            --build-arg EXTRAS=redis \
            --build-arg VERSION=edge --build-arg REVISION="$GITHUB_SHA" \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:edge" \
            --push .
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: s00pcan
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: s00pcan/netaudio
          short-description: Dante network audio daemon, web interface and MCP server
          readme-filepath: README.md
