name: release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check
      - run: uv run --isolated --python 3.9 --no-project python -m compileall -q packages/netaudio/src/netaudio
      - run: uv run ruff check .
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsSL https://pypi.org/pypi/netaudio/json | python3 -c 'import json, sys; sys.exit(sys.argv[1] in json.load(sys.stdin)["releases"])' "$version"; then
            echo "version $version is not yet on PyPI"
          else
            echo "version $version is already published on PyPI; bump the version before tagging" >&2
            exit 1
          fi

  test:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: cargo test --manifest-path packages/netaudio-core/Cargo.toml
      - run: uv run pytest -q

  build-wheel:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64:latest
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64:latest
            artifact: linux-aarch64
          - runner: macos-15
            platform: macos
            architecture: arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
            artifact: macos-x86_64
          - runner: windows-latest
            platform: windows
            architecture: x86_64
            artifact: windows-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - if: matrix.platform == 'linux'
        name: Build at the manylinux 2.28 compatibility floor
        shell: bash
        run: |
          docker run --pull always --rm \
            --volume "$PWD:/project" --workdir /project \
            "${{ matrix.manylinux-image }}" /bin/bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$HOME/.cargo/bin:/opt/python/cp39-cp39/bin:$PATH"
              python -m pip install --disable-pip-version-check uv auditwheel
              uv build --wheel
              wheel=(dist/*.whl)
              test "${#wheel[@]}" -eq 1
              original_wheel="${wheel[0]}"
              mkdir -p dist/unrepaired
              mv "$original_wheel" dist/unrepaired/
              auditwheel repair --plat "manylinux_2_28_$(uname -m)" \
                --wheel-dir dist "dist/unrepaired/${original_wheel##*/}"
              repaired_wheel=(dist/*.whl)
              test "${#repaired_wheel[@]}" -eq 1
              auditwheel show "${repaired_wheel[0]}"
            '
      - if: matrix.platform != 'linux'
        run: uv build --wheel
      - shell: bash
        run: |
          wheel=(dist/*.whl)
          if [ "${#wheel[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist, found ${#wheel[@]}" >&2
            exit 1
          fi
          python scripts/verify_wheel_artifact.py "${wheel[0]}" \
            --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}"
          for python_version in 3.9 3.10 3.11 3.12 3.13; do
            uv run --isolated --no-project --python "$python_version" \
              python scripts/smoke_wheel_install.py "${wheel[0]}"
          done
      - shell: bash
        run: |
          wheel=(dist/*.whl)
          uv run --isolated --no-project --python 3.9 --with "${wheel[0]}" \
            python -c "from netaudio import core; core.require(); assert len(core.build_command({'command': 'reboot', 'host_mac': '001122334455'})) > 0"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.artifact }}
          path: dist/*.whl

  build-sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - shell: bash
        run: |
          archive=(dist/*.tar.gz)
          if [ "${#archive[@]}" -ne 1 ]; then
            echo "expected exactly one source distribution in dist, found ${#archive[@]}" >&2
            exit 1
          fi
          wheel_dir="$(mktemp -d)"
          trap 'rm -rf "$wheel_dir"' EXIT
          uv build --wheel --out-dir "$wheel_dir" "${archive[0]}"
          wheel=("$wheel_dir"/*.whl)
          if [ "${#wheel[@]}" -ne 1 ]; then
            echo "expected exactly one wheel built from the source distribution, found ${#wheel[@]}" >&2
            exit 1
          fi
          uv run --isolated --no-project --python 3.9 --with "${wheel[0]}" \
            python scripts/smoke_wheel.py
          uv run --isolated --no-project --python 3.9 --with "${wheel[0]}" \
            python -c "from netaudio import core; core.require(); assert len(core.build_command({'command': 'reboot', 'host_mac': '001122334455'})) > 0"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-xcframework:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - run: ./scripts/build_xcframework.sh
      - run: |
          listing="$(unzip -l dist/netaudio_core.xcframework.zip)"
          for path in Info.plist ios-arm64/libnetaudio_core.a ios-arm64-simulator/libnetaudio_core.a ios-arm64/Headers/netaudio_core.h ios-arm64-simulator/Headers/netaudio_core.h; do
            if ! grep -q "$path" <<< "$listing"; then
              echo "xcframework zip is missing $path" >&2
              echo "$listing" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: dist/netaudio_core.xcframework.zip

  release:
    needs: [build-wheel, build-sdist, build-xcframework]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*

  publish-pypi:
    needs: [build-wheel, build-sdist, build-xcframework, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
