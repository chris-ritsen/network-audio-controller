name: release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --isolated --python 3.9 --no-project python -m compileall -q packages/netaudio/src/netaudio
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi

  build-wheel:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64:latest
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64:latest
            artifact: linux-aarch64
          - runner: macos-15
            platform: macos
            architecture: arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
            artifact: macos-x86_64
          - runner: windows-latest
            platform: windows
            architecture: x86_64
            artifact: windows-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - if: matrix.platform == 'linux'
        name: Build at the manylinux 2.28 compatibility floor
        shell: bash
        run: |
          docker run --pull always --rm \
            --volume "$PWD:/project" --workdir /project \
            "${{ matrix.manylinux-image }}" /bin/bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$HOME/.cargo/bin:/opt/python/cp39-cp39/bin:$PATH"
              python -m pip install --disable-pip-version-check uv auditwheel
              uv build --wheel
              wheel=(dist/*.whl)
              test "${#wheel[@]}" -eq 1
              auditwheel show "${wheel[0]}"
            '
      - if: matrix.platform != 'linux'
        run: uv build --wheel
      - shell: bash
        run: |
          wheel=(dist/*.whl)
          if [ "${#wheel[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist, found ${#wheel[@]}" >&2
            exit 1
          fi
          python scripts/verify_wheel_artifact.py "${wheel[0]}" \
            --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}"
          for python_version in 3.9 3.10 3.11 3.12 3.13; do
            uv run --isolated --no-project --python "$python_version" \
              python scripts/smoke_wheel_install.py "${wheel[0]}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.artifact }}
          path: dist/*.whl

  build-sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - shell: bash
        run: |
          archive=(dist/*.tar.gz)
          if [ "${#archive[@]}" -ne 1 ]; then
            echo "expected exactly one source distribution in dist, found ${#archive[@]}" >&2
            exit 1
          fi
          wheel_dir="$(mktemp -d)"
          trap 'rm -rf "$wheel_dir"' EXIT
          uv build --wheel --out-dir "$wheel_dir" "${archive[0]}"
          wheel=("$wheel_dir"/*.whl)
          if [ "${#wheel[@]}" -ne 1 ]; then
            echo "expected exactly one wheel built from the source distribution, found ${#wheel[@]}" >&2
            exit 1
          fi
          uv run --isolated --no-project --python 3.9 --with "${wheel[0]}" \
            python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-xcframework:
    needs: check-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - run: ./scripts/build_xcframework.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: dist/netaudio_core.xcframework.zip

  release:
    needs: [build-wheel, build-sdist, build-xcframework]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*

  publish-pypi:
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
